<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clef test dApp</title>
  </head>
  <body>
    <h1>Clef test dApp</h1>
    <!-- Query params: ?rpc=<url> fetches a real blockhash (else a fixed one), ?chain=<id> (default solana:mainnet). -->
    <div>
      <button id="connect">Connect</button>
      <button id="sign-batch">Sign batch (3 txs)</button>
      <button id="sign-and-send">Sign and send SOL transfer</button>
      <button id="sign-message">Sign message</button>
      <button id="sign-message-tx">Sign tx look-alike message</button>
      <button id="sign-in">Sign in</button>
    </div>
    <pre id="out"></pre>
    <script>
      // Minimal Wallet Standard app side (no dependencies).
      const wallets = [];
      const api = {
        register: (...ws) => {
          wallets.push(...ws);
          return () => {};
        },
      };
      window.addEventListener('wallet-standard:register-wallet', (e) => e.detail(api));
      window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: api }));
      window.clef = () => wallets.find((w) => w.name === 'Clef');
      window.events = [];
      window.fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      window.toB64 = (b) => btoa(String.fromCharCode(...b));
      window.verify = async (pub, sig, msg) =>
        crypto.subtle.verify('Ed25519', await crypto.subtle.importKey('raw', pub, 'Ed25519', false, ['verify']), sig, msg);

      const params = new URLSearchParams(location.search);
      const CHAIN = params.get('chain') ?? 'solana:mainnet';
      const SYSTEM = '11111111111111111111111111111111';
      const FIXED_BLOCKHASH = 'EETubP5AKHgjPAhzPAFcb8BAY1hMH639CWCFTqi3hq1k';
      const RECIPIENTS = [
        'DobneDaZ2D7ELwRi2qdfVk98icbspoyY6yyHtMetakLk',
        '9WZ6zuyPaHRcwhnmzLQhyQYwyLWoeAvAH4naV66tDati',
        '3JY6L3aZ8VPTwyzRGy948rpvk6JAVXiRrv1eobsTYwhe',
      ];

      const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
      window.b58decode = (s) => {
        let n = 0n;
        for (const c of s) n = n * 58n + BigInt(B58.indexOf(c));
        const out = [];
        while (n > 0n) {
          out.unshift(Number(n & 0xffn));
          n >>= 8n;
        }
        for (const c of s) {
          if (c !== '1') break;
          out.unshift(0);
        }
        return Uint8Array.from(out);
      };
      window.b58encode = (b) => {
        let n = 0n;
        for (const x of b) n = (n << 8n) | BigInt(x);
        let s = '';
        while (n > 0n) {
          s = B58[Number(n % 58n)] + s;
          n /= 58n;
        }
        for (const x of b) {
          if (x !== 0) break;
          s = '1' + s;
        }
        return s;
      };

      async function blockhash() {
        const rpc = params.get('rpc');
        if (!rpc) return FIXED_BLOCKHASH;
        const res = await fetch(rpc, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getLatestBlockhash', params: [{ commitment: 'confirmed' }] }),
        });
        return (await res.json()).result.value.blockhash;
      }

      // Legacy message: one SOL transfer from `from` to `to`.
      function transferMessage(from, to, lamports, hash) {
        const data = new Uint8Array(12);
        const view = new DataView(data.buffer);
        view.setUint32(0, 2, true);
        view.setBigUint64(4, BigInt(lamports), true);
        return Uint8Array.from([
          1, 0, 1,
          3, ...b58decode(from), ...b58decode(to), ...b58decode(SYSTEM),
          ...b58decode(hash),
          1, 2, 2, 0, 1, data.length, ...data,
        ]);
      }
      // Unsigned wire transaction: one empty signature slot, then the message.
      const unsignedWire = (message) => Uint8Array.from([1, ...new Uint8Array(64), ...message]);

      function account() {
        const wallet = window.clef();
        const acc = wallet?.accounts[0];
        if (!acc) throw new Error('not connected');
        return { wallet, acc };
      }

      window.actions = {
        async connect() {
          const wallet = window.clef();
          if (!window.listening) {
            wallet.features['standard:events'].on('change', ({ accounts }) => accounts && window.events.push(accounts.map((a) => a.address)));
            window.listening = true;
          }
          const { accounts } = await wallet.features['standard:connect'].connect();
          return { accounts: accounts.map((a) => a.address) };
        },
        async signBatch() {
          const { wallet, acc } = account();
          const hash = await blockhash();
          const inputs = RECIPIENTS.map((to, i) => ({
            account: acc,
            chain: CHAIN,
            transaction: unsignedWire(transferMessage(acc.address, to, 1_000_000 * (i + 1), hash)),
          }));
          const outs = await wallet.features['solana:signTransaction'].signTransaction(...inputs);
          return { signedTransactions: outs.map((o) => toB64(o.signedTransaction)) };
        },
        /** A wire the test built (e.g. a large v1 transaction): `window.wire` (base64), signed or signed and sent. */
        async signWire() {
          const { wallet, acc } = account();
          const [out] = await wallet.features['solana:signTransaction'].signTransaction({ account: acc, chain: CHAIN, transaction: fromB64(window.wire) });
          return { signed: toB64(out.signedTransaction) };
        },
        async sendWire() {
          const { wallet, acc } = account();
          const [out] = await wallet.features['solana:signAndSendTransaction'].signAndSendTransaction({ account: acc, chain: CHAIN, transaction: fromB64(window.wire) });
          return { signature: b58encode(out.signature) };
        },
        async signAndSend() {
          const { wallet, acc } = account();
          const tx = unsignedWire(transferMessage(acc.address, RECIPIENTS[0], 10_000_000, await blockhash()));
          const [out] = await wallet.features['solana:signAndSendTransaction'].signAndSendTransaction({ account: acc, chain: CHAIN, transaction: tx });
          return { signature: b58encode(out.signature) };
        },
        async signMessage() {
          const { wallet, acc } = account();
          const message = new TextEncoder().encode('Hello from the Clef test dApp');
          const [out] = await wallet.features['solana:signMessage'].signMessage({ account: acc, message });
          return { verified: await verify(acc.publicKey, out.signature, message) };
        },
        async signMessageTxLookAlike() {
          const { wallet, acc } = account();
          const message = transferMessage(acc.address, RECIPIENTS[0], 1_000_000_000, FIXED_BLOCKHASH);
          const [out] = await wallet.features['solana:signMessage'].signMessage({ account: acc, message });
          return { verified: await verify(acc.publicKey, out.signature, message) };
        },
        async signIn() {
          const wallet = window.clef();
          const [out] = await wallet.features['solana:signIn'].signIn({
            domain: location.host,
            uri: location.origin,
            statement: 'Sign in to the Clef test dApp',
            nonce: crypto.randomUUID().replaceAll('-', ''),
            issuedAt: new Date().toISOString(),
          });
          return {
            address: out.account.address,
            verified: await verify(out.account.publicKey, out.signature, out.signedMessage),
            signedMessage: new TextDecoder().decode(out.signedMessage),
          };
        },
      };

      // Each action resolves to a result object, or { code, message } on failure; also shown in #out.
      window.run = async (name) => {
        let result;
        try {
          result = await window.actions[name]();
        } catch (e) {
          result = { code: e?.code, message: String(e?.message ?? e) };
        }
        window.lastResult = result;
        document.getElementById('out').textContent = JSON.stringify(result, null, 2);
        return result;
      };
      const BUTTONS = {
        connect: 'connect',
        'sign-batch': 'signBatch',
        'sign-and-send': 'signAndSend',
        'sign-message': 'signMessage',
        'sign-message-tx': 'signMessageTxLookAlike',
        'sign-in': 'signIn',
      };
      for (const [id, name] of Object.entries(BUTTONS)) document.getElementById(id).addEventListener('click', () => window.run(name));
    </script>
  </body>
</html>
