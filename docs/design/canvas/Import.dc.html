<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Import wallet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button,textarea,input{font:inherit}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Import a wallet</h1>
  </header>

  <div role="tablist" aria-label="Import type" style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; background: #EEF0F4; border-radius: 10px">
    <button type="button" role="tab" aria-selected="true" style="height: 34px; background: #FFFFFF; color: #14171F; border: 0; border-radius: 7px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(20,23,31,0.14)">Phrase</button>
    <button type="button" role="tab" aria-selected="false" style="height: 34px; background: transparent; color: #5C6475; border: 0; border-radius: 7px; font-size: 12px">Private key</button>
    <button type="button" role="tab" aria-selected="false" style="height: 34px; background: transparent; color: #5C6475; border: 0; border-radius: 7px; font-size: 12px">Watch-only</button>
  </div>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px; flex: 1">
    <label for="phrase" style="font-size: 12px; color: #5C6475">Recovery phrase (12 or 24 words)</label>
    <textarea id="phrase" class="m" rows="3" style="box-sizing: border-box; padding: 12px; background: #FFFFFF; border: 1px solid #4A6B12; border-radius: 12px; color: #14171F; font-size: 14px; line-height: 1.5; resize: none; outline: none; filter: blur(3px)">orbit maple tunnel quiz salad pilot hazard velvet crane lunar attic meadow</textarea>
    <div style="display: flex; align-items: center; font-size: 12px"><span style="color: #0F7A62">✓ 12 words · valid checksum</span><button type="button" style="margin-left: auto; background: transparent; border: 0; color: #2752B8; font-size: 12px; min-height: 32px">Show</button></div>

    <div style="margin-top: 6px; display: flex; align-items: center; font-size: 12px; color: #5C6475">
      <span style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Accounts found</span>
      <span class="m" style="margin-left: auto">44'/501'/n'/0'</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; overflow: hidden">
      <li><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475">#0</span><span class="m" style="flex: 1; font-size: 14px">7xKp…3fQa</span><span style="font-size: 12px">6.21 SOL · 3 tokens</span></label></li>
      <li style="border-top: 1px solid #E6E8EE"><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475">#1</span><span class="m" style="flex: 1; font-size: 14px">9aLq…Tz1e</span><span style="font-size: 12px">0.40 SOL</span></label></li>
      <li style="border-top: 1px solid #E6E8EE"><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475">#2</span><span class="m" style="flex: 1; font-size: 14px; color: #5C6475">Fd3r…uY6b</span><span style="font-size: 12px; color: #5C6475">empty</span></label></li>
    </ul>
    <button type="button" style="align-self: flex-start; min-height: 32px; background: transparent; border: 0; padding: 0; color: #2752B8; font-size: 12px">Use a different derivation path</button>
  </div>

  <div style="padding: 12px 16px 16px">
    <button type="button" style="width: 100%; height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600">Import 2 accounts</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
