<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Swap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Swap</h1>
    <button type="button" aria-label="Slippage settings, currently 0.5%" style="margin-left: auto; height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 999px; color: #14171F; font-size: 12px; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span>0.5%</span>
    </button>
  </header>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; flex: 1">
    <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
      <section style="padding: 14px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; font-size: 12px; color: #5C6475">
          <label for="pay">You pay</label>
          <span style="margin-left: auto; font-variant-numeric: tabular-nums">Balance 6.2104</span>
          <button type="button" style="margin-left: 8px; height: 28px; padding: 0 10px; background: transparent; border: 1px solid #CBD0DA; border-radius: 999px; color: #14171F; font-size: 12px; font-weight: 600; cursor: pointer">MAX</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <input id="pay" value="1.5" inputmode="decimal" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #14171F; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">
          <button type="button" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; background: #EEF0F4; border: 1px solid #E1E4EA; border-radius: 999px; color: #14171F; cursor: pointer">
            <span style="width: 26px; height: 26px; border-radius: 50%; background: #ECE7FB; color: #5B3FC4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">S</span>
            <span style="font-size: 14px; font-weight: 500">SOL</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
        <span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">≈ $212.40</span>
      </section>

      <button type="button" aria-label="Switch tokens" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #CBD0DA; border-radius: 12px; box-shadow: 0 0 0 4px #F5F6F8; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"></path></svg>
      </button>

      <section style="padding: 14px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; font-size: 12px; color: #5C6475">
          <span>You receive</span>
          <span style="margin-left: auto; font-variant-numeric: tabular-nums">Balance 312.40</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; min-width: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">212.40</span>
          <button type="button" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; background: #EEF0F4; border: 1px solid #E1E4EA; border-radius: 999px; color: #14171F; cursor: pointer">
            <span style="width: 26px; height: 26px; border-radius: 50%; background: #E5EDFC; color: #2752B8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">U</span>
            <span style="font-size: 14px; font-weight: 500">USDC</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
        <span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">≈ $212.37 · price impact &lt;0.01%</span>
      </section>
    </div>

    <dl style="margin: 14px 0 0; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; column-gap: 12px; font-size: 12px; font-variant-numeric: tabular-nums">
      <dt style="color: #5C6475">Rate</dt><dd style="margin: 0; text-align: right">1 SOL = 141.60 USDC</dd>
      <dt style="color: #5C6475">Minimum received</dt><dd style="margin: 0; text-align: right">211.34 USDC</dd>
      <dt style="color: #5C6475">Route</dt><dd style="margin: 0; text-align: right">Orca → Raydium <span style="color: #5C6475">via Jupiter</span></dd>
      <dt style="color: #5C6475">Network fee</dt><dd style="margin: 0; text-align: right">~0.000105 SOL</dd>
      <dt style="color: #5C6475">Clef fee</dt><dd style="margin: 0; text-align: right; color: #0F7A62">None</dd>
    </dl>

    <div style="margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5C6475">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"></path></svg>
      <span>Quote refreshes in 12 s</span>
    </div>
  </div>

  <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="width: 100%; height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer">Review swap</button>
    <span style="font-size: 12px; color: #5C6475; text-align: center">You’ll see what the transaction does before signing</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
