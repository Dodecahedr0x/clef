<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Portfolio (Expert)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E6E8EE">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A6B12" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke-opacity="0.35"></path><circle cx="9" cy="12" r="3.2"></circle><path d="M12.2 12H20M17 12v3M20 12v2"></path></svg>
    <button type="button" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 10px; color: #14171F">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #3D6FE0"></span>
      <span class="m" style="font-size: 12px">7xKp…3fQa</span>
    </button>
    <div role="radiogroup" aria-label="Network" style="margin-left: auto; display: flex; padding: 3px; background: #EEF0F4; border-radius: 10px">
      <button type="button" role="radio" aria-checked="true" style="height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 5px; background: #FFFFFF; color: #14171F; border: 0; border-radius: 7px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(20,23,31,0.14)"><span style="width: 6px; height: 6px; border-radius: 50%; background: #0F7A62"></span>Main</button>
      <button type="button" role="radio" aria-checked="false" style="height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 5px; background: transparent; color: #5C6475; border: 0; border-radius: 7px; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #A86400"></span>Dev</button>
    </div>
    <button type="button" aria-label="Settings" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </button>
  </header>

  <div class="m" style="padding: 6px 14px; display: flex; gap: 10px; font-size: 12px; color: #5C6475; background: #FFFFFF; border-bottom: 1px solid #E6E8EE">
    <span>[YOUR RPC URL]</span><span style="margin-left: auto">slot 287,412,903</span><span style="color: #0F7A62">84 ms</span>
  </div>

  <section style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 12px; color: #5C6475">Total balance</span>
    <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">$1,284.52</div>
    <div class="m" style="font-size: 12px; color: #5C6475">6.210400000 SOL · 6,210,400,000 lamports</div>
  </section>

  <nav aria-label="Wallet actions" style="padding: 0 16px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 44px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 12px; font-weight: 600">Send</button>
    <button type="button" style="height: 44px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 12px">Receive</button>
    <button type="button" style="height: 44px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 12px">Swap</button>
    <button type="button" style="height: 44px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 12px">History</button>
  </nav>

  <div style="padding: 0 16px 6px; display: flex; align-items: center; font-size: 12px; color: #5C6475">
    <span style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Token accounts</span>
    <span style="margin-left: auto">Token + Token-2022</span>
  </div>
  <ul style="list-style: none; margin: 0 12px; padding: 0; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden">
    <sc-for list="{{tokens}}" as="t" hint-placeholder-count="4">
      <li style="padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; border-top: {{t.border}}">
        <span style="font-size: 14px; font-weight: 500">{{t.sym}} <span style="font-size: 12px; font-weight: 400; color: #5C6475">{{t.prog}}</span></span>
        <span style="font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums">{{t.usd}}</span>
        <span class="m" style="font-size: 12px; color: #5C6475">mint {{t.mint}} · ata {{t.ata}}</span>
        <span class="m" style="font-size: 12px; color: #5C6475; text-align: right">{{t.raw}}</span>
      </li>
    </sc-for>
  </ul>

  <footer style="margin-top: auto; height: 40px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #E6E8EE; font-size: 12px; color: #5C6475">
    <span>Signing detail</span><span style="margin-left: auto; color: #14171F; font-weight: 600">Expert</span>
    <span>· switch network</span><kbd class="m" style="padding: 1px 5px; border: 1px solid #CBD0DA; border-radius: 5px; background: #FFFFFF">⌥N</kbd>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  var rows = [
    ['wSOL', 'Token', '$0.00', 'So11…1112', '4fYN…wQ1c', '0 · 9 dp'],
    ['USDC', 'Token', '$312.40', 'EPjF…Dt1v', 'BtLe…9mHv', '312400000 · 6 dp'],
    ['JUP', 'Token', '$92.73', 'JUPy…DvCN', 'H3pd…a8Ve', '140000000 · 6 dp'],
    ['PYUSD', 'Token-2022', '$0.00', '2b1k…4GXo', 'Fq9n…Q2tM', '0 · 6 dp']
  ];
  return { tokens: rows.map(function (r, i) {
    return { sym: r[0], prog: r[1], usd: r[2], mint: r[3], ata: r[4], raw: r[5], border: i ? '1px solid #E6E8EE' : '0' };
  }) };
}
}
</script>
</body>
</html>
