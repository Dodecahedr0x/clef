<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Recovery phrase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 0 20px 20px; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; margin: 0 -14px; display: flex; align-items: center">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <div aria-label="Step 2 of 3" style="margin-left: auto; margin-right: 14px; display: flex; gap: 4px"><span style="width: 24px; height: 4px; border-radius: 2px; background: #4A6B12"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #4A6B12"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #CBD0DA"></span></div>
  </header>

  <h1 style="margin: 8px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Your recovery phrase</h1>
  <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #5C6475">Write these 12 words on paper, in order. They’re the only way back in if you lose this device.</p>

  <ol class="m" style="list-style: none; margin: 18px 0 0; padding: 12px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 14px">
    <sc-for list="{{words}}" as="w" hint-placeholder-count="12">
      <li style="height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 10px; background: #F1F3F7; border-radius: 8px"><span style="width: 18px; color: #8A91A0; font-size: 12px; text-align: right">{{w.n}}</span>{{w.w}}</li>
    </sc-for>
  </ol>

  <div style="margin-top: 12px; padding: 10px 12px; display: flex; gap: 10px; background: #FDF0ED; border: 1px solid #F2B8AC; border-radius: 12px; font-size: 12px; line-height: 1.45; color: #6E2417">
    <svg style="flex: none; margin-top: 1px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8402A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6z"></path><path d="M12 8v4M12 15.5v.01"></path></svg>
    <span>Anyone with these words owns your funds. Clef will never ask for them — not in a site, popup or message.</span>
  </div>

  <button type="button" style="margin-top: auto; height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600">I wrote them down</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  var list = ['orbit', 'maple', 'tunnel', 'quiz', 'salad', 'pilot', 'hazard', 'velvet', 'crane', 'lunar', 'attic', 'meadow'];
  return { words: list.map(function (w, i) { return { n: String(i + 1), w: w }; }) };
}
}
</script>
</body>
</html>
