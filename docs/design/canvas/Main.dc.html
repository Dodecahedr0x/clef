<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Portfolio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E6E8EE">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke-opacity="0.35"></path><circle cx="9" cy="12" r="3.2"></circle><path d="M12.2 12H20M17 12v3M20 12v2"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px; letter-spacing: -0.02em">clef</span>
    </div>
    <button type="button" style="margin-left: 6px; flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 10px; color: #14171F">
      <span style="width: 18px; height: 18px; border-radius: 50%; background: #3D6FE0; flex: none"></span>
      <span style="font-size: 14px; font-weight: 500">Main</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C6475">7xKp…3fQa</span>
      <svg style="margin-left: auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <section style="padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5C6475">
      <span>Total balance</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E1E4EA; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #0F7A62"></span>Mainnet</span>
    </div>
    <div style="font-size: 38px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">$1,284.52</div>
    <div style="font-size: 14px; color: #0F7A62; font-variant-numeric: tabular-nums">+$18.20 · 1.4% today</div>
  </section>

  <nav aria-label="Wallet actions" style="padding: 0 16px 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: {{accent}}; color: #FFFFFF; border: 0; border-radius: 14px; font-size: 12px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>Send</button>
    <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 14px; font-size: 12px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M16 17H7V8"></path></svg>Receive</button>
    <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 14px; font-size: 12px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>Swap</button>
    <button type="button" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 14px; font-size: 12px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>History</button>
  </nav>

  <div role="tablist" aria-label="Portfolio sections" style="padding: 0 16px; display: flex; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 10px; background: transparent; border: 0; border-bottom: 2px solid {{accent}}; color: #14171F; font-size: 14px; font-weight: 600">Tokens</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 10px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #5C6475; font-size: 14px">Activity</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 10px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #5C6475; font-size: 14px">Sites</button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 6px 8px; display: flex; flex-direction: column; flex: 1; overflow: hidden">
    <li style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 12px; border-radius: 10px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #ECE7FB; color: #5B3FC4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none">S</span>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">Solana</span><span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">6.2104 SOL</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums"><span style="font-size: 14px; font-weight: 500">$879.39</span><span style="font-size: 12px; color: #0F7A62">+2.1%</span></div>
    </li>
    <li style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 12px; border-radius: 10px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #E5EDFC; color: #2752B8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none">U</span>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">USD Coin</span><span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">312.40 USDC</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums"><span style="font-size: 14px; font-weight: 500">$312.40</span><span style="font-size: 12px; color: #5C6475">0.0%</span></div>
    </li>
    <li style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 12px; border-radius: 10px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #EDF3DF; color: #4A6B12; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none">J</span>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">Jupiter</span><span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">140.00 JUP</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums"><span style="font-size: 14px; font-weight: 500">$92.73</span><span style="font-size: 12px; color: #C2341F">−0.8%</span></div>
    </li>
    <li style="height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5C6475">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10 10 0 0 1 22 12a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path></svg>
      <span>4 spam tokens hidden</span>
      <a href="#" style="margin-left: auto; font-size: 12px">Show</a>
    </li>
  </ul>

  <footer style="height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #E6E8EE; font-size: 12px; color: #5C6475">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6"></path></svg>
    <span>Signing detail</span>
    <span style="margin-left: auto; color: #14171F; font-weight: 500">Intermediate</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4A6B12","options":["#4A6B12","#0F7A62","#A86400","#2752B8"]},"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4A6B12' };
}
}
</script>
</body>
</html>
