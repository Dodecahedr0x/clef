<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Connect Keystone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Connect Keystone</h1>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1">
    <div role="img" aria-label="Camera preview, waiting for Keystone sync QR" style="position: relative; height: 240px; border-radius: 16px; background: #1E222B; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <div style="position: relative; width: 160px; height: 160px">
        <span style="position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-left: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF; border-top-left-radius: 8px"></span>
        <span style="position: absolute; right: 0; top: 0; width: 28px; height: 28px; border-right: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF; border-top-right-radius: 8px"></span>
        <span style="position: absolute; left: 0; bottom: 0; width: 28px; height: 28px; border-left: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF; border-bottom-left-radius: 8px"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 28px; height: 28px; border-right: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF; border-bottom-right-radius: 8px"></span>
        <span style="position: absolute; left: 12px; right: 12px; top: 72px; height: 2px; background: #C7DA9C"></span>
      </div>
      <span style="position: absolute; left: 12px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #FFFFFF"><span style="width: 7px; height: 7px; border-radius: 50%; background: #C8402A"></span>Camera on</span>
    </div>

    <ol style="margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45">
      <li>On Keystone, open <strong>Connect software wallet</strong> and choose <strong>Solana</strong>.</li>
      <li>Hold its QR code up to your camera.</li>
    </ol>
    <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5C6475">Clef opened this in a full tab so it can use the camera. Only public keys are shared — never secrets.</p>
  </div>

  <div style="padding: 0 16px 16px">
    <button type="button" style="width: 100%; height: 48px; background: #FFFFFF; color: #14171F; border: 1px solid #CBD0DA; border-radius: 12px; font-size: 14px; font-weight: 500">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
