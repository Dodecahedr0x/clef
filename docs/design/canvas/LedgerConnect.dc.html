<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Connect Ledger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button,input{font:inherit}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Connect Ledger</h1>
  </header>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; flex: 1">
    <section style="padding: 12px 14px; background: #E8F6F1; border: 1px solid #B5E0D3; border-radius: 12px; display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 44px; height: 18px; border-radius: 4px; background: #14171F"></span>
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600; color: #0B5C49">Ledger connected</span><span style="font-size: 12px; color: #2E6B5C">USB · Solana app open</span></div>
    </section>

    <div role="radiogroup" aria-label="Derivation path" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; background: #EEF0F4; border-radius: 10px">
      <button type="button" role="radio" aria-checked="true" class="m" style="height: 34px; background: #FFFFFF; color: #14171F; border: 0; border-radius: 7px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(20,23,31,0.14); cursor: pointer">44'/501'/n'</button>
      <button type="button" role="radio" aria-checked="false" class="m" style="height: 34px; background: transparent; color: #5C6475; border: 0; border-radius: 7px; font-size: 12px; cursor: pointer">44'/501'/n'/0'</button>
    </div>

    <div style="display: flex; font-size: 12px; color: #5C6475"><span style="font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Addresses on this Ledger</span></div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; overflow: hidden">
      <li><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475; width: 24px">0</span><span class="m" style="flex: 1; font-size: 14px">Ct4m…Q8xe</span><span style="font-size: 12px">2.89 SOL</span></label></li>
      <li style="border-top: 1px solid #E6E8EE"><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475; width: 24px">1</span><span class="m" style="flex: 1; font-size: 14px">Lm2x…Hp5V</span><span style="font-size: 12px; color: #5C6475">empty</span></label></li>
      <li style="border-top: 1px solid #E6E8EE"><label style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 10px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #4A6B12"><span class="m" style="font-size: 12px; color: #5C6475; width: 24px">2</span><span class="m" style="flex: 1; font-size: 14px">Ry7c…Bd1K</span><span style="font-size: 12px; color: #5C6475">empty</span></label></li>
    </ul>
    <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #5C6475">Clef re-checks each address on the device before every signature.</p>
  </div>

  <div style="padding: 12px 16px 16px">
    <button type="button" style="width: 100%; height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer">Add 1 account</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
