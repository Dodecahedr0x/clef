<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Add account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Add account</h1>
  </header>

  <ul style="list-style: none; margin: 12px; padding: 0; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 14px; overflow: hidden">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
      <li>
        <button type="button" style="width: 100%; min-height: 72px; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: transparent; border: 0; border-top: {{o.border}}; color: #14171F; text-align: left">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: {{o.tint}}; color: {{o.ink}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none">{{o.mark}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 14px; font-weight: 600">{{o.title}}</span><span style="font-size: 12px; color: #5C6475">{{o.desc}}</span></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  var opts = [
    ['+', 'New account', 'Next address from your recovery phrase', '#EEF5DD', '#4A6B12'],
    ['↓', 'Import', 'Another recovery phrase or a private key', '#EEF0F4', '#14171F'],
    ['L', 'Ledger', 'Connect over USB', '#ECE7FB', '#5B3FC4'],
    ['K', 'Keystone', 'Pair by scanning a QR code', '#EEF0F4', '#14171F'],
    ['S', 'Squads multisig', 'Propose and vote with one of your accounts', '#FDF4E3', '#A86400'],
    ['◎', 'Watch an address', 'See balances and preview requests, no signing', '#E5EDFC', '#2752B8']
  ];
  return { opts: opts.map(function (o, i) { return { mark: o[0], title: o[1], desc: o[2], tint: o[3], ink: o[4], border: i ? '1px solid #E6E8EE' : '0' }; }) };
}
}
</script>
</body>
</html>
