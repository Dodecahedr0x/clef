<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Set a password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 0 20px 20px; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; margin: 0 -14px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <div aria-label="Step 1 of 3" style="margin-left: auto; margin-right: 14px; display: flex; gap: 4px"><span style="width: 24px; height: 4px; border-radius: 2px; background: #4A6B12"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #CBD0DA"></span><span style="width: 24px; height: 4px; border-radius: 2px; background: #CBD0DA"></span></div>
  </header>

  <h1 style="margin: 12px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Set a password</h1>
  <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #5C6475">It unlocks Clef on this device. It can’t be recovered — your recovery phrase can.</p>

  <form style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px">
    <label for="p1" style="font-size: 12px; color: #5C6475">Password</label>
    <input id="p1" type="password" value="a-long-passphrase" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #4A6B12; border-radius: 12px; color: #14171F; font-size: 14px; outline: none">
    <div style="display: flex; align-items: center; gap: 8px">
      <div aria-hidden="true" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 2px; background: #0F7A62"></span><span style="height: 4px; border-radius: 2px; background: #0F7A62"></span><span style="height: 4px; border-radius: 2px; background: #0F7A62"></span><span style="height: 4px; border-radius: 2px; background: #CBD0DA"></span></div>
      <span style="font-size: 12px; color: #0F7A62">Strong</span>
    </div>
    <label for="p2" style="margin-top: 10px; font-size: 12px; color: #5C6475">Confirm password</label>
    <input id="p2" type="password" value="a-long-passphrase" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #CBD0DA; border-radius: 12px; color: #14171F; font-size: 14px; outline: none">
    <span style="font-size: 12px; color: #0F7A62">✓ Passwords match</span>
  </form>

  <button type="button" style="margin-top: auto; height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer">Continue</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
