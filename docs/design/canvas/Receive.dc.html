<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Receive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Receive</h1>
    <button type="button" style="margin-left: auto; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 999px; color: #14171F; font-size: 12px">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #3D6FE0"></span>
      <span style="font-weight: 600">Main</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5C6475" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </header>

  <div style="padding: 24px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1">
    <div style="padding: 16px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 20px; position: relative">
      <div role="img" aria-label="QR code of your Main account address" style="width: 184px; height: 184px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
          <div style="background: {{c.bg}}"></div>
        </sc-for>
      </div>
      <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 4px #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A6B12" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18" stroke-opacity="0.35"></path><circle cx="9" cy="12" r="3.2" fill="#FFFFFF"></circle><path d="M12.2 12H20M17 12v3M20 12v2"></path></svg>
      </span>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #5C6475; text-align: center">Your Solana address</span>
      <p style="margin: 0; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.6; text-align: center; word-spacing: 0.2em"><strong style="font-weight: 600">7xKp</strong> Wm2Q dL9v Hc4T rB8n YeX5 uJ3k Ps6A Gf1z Nq7R <strong style="font-weight: 600">3fQa</strong></p>
      <span style="font-size: 12px; color: #5C6475; text-align: center">Check the first and last 4 characters match where you paste it.</span>
    </div>
  </div>

  <div style="padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; background: #E5EDFC; border-radius: 12px; font-size: 12px; line-height: 1.45; color: #1A3A86">
      <svg style="flex: none; margin-top: 1px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2752B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg>
      <span>Accepts SOL and any Solana token on <strong>Mainnet</strong>. Don’t send from other chains.</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg>Copy</button>
      <button type="button" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; color: #14171F; border: 1px solid #CBD0DA; border-radius: 12px; font-size: 14px; font-weight: 500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>Share</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  // Decorative QR-style pattern (not a real encoding): finder squares + seeded noise.
  var N = 25, cells = [], seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function finder(r, c) {
    var spots = [[0, 0], [0, N - 7], [N - 7, 0]];
    for (var i = 0; i < 3; i++) {
      var y = r - spots[i][0], x = c - spots[i][1];
      if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
        if (y < 0 || y > 6 || x < 0 || x > 6) return 0;
        var ring = Math.min(y, x, 6 - y, 6 - x);
        return ring === 1 ? 0 : 1;
      }
    }
    return -1;
  }
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
    var f = finder(r, c);
    var on = f === -1 ? rnd() < 0.5 : f === 1;
    cells.push({ bg: on ? '#14171F' : 'transparent' });
  }
  return { cells: cells };
}
}
</script>
</body>
</html>
