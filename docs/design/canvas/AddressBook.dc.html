<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clef — Address book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Address book</h1>
    <button type="button" aria-label="Add contact" style="margin-left: auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #4A6B12; border: 0; border-radius: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div role="tablist" aria-label="Address book" style="padding: 0 16px; display: flex; gap: 4px; border-bottom: 1px solid #E6E8EE">
    <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 10px; background: transparent; border: 0; border-bottom: 2px solid #4A6B12; color: #14171F; font-size: 14px; font-weight: 600">Contacts · 4</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 10px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #5C6475; font-size: 14px">Account labels · 2</button>
  </div>

  <ul style="list-style: none; margin: 12px; padding: 0; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; overflow: hidden">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <li style="min-height: 60px; padding: 8px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; border-top: {{p.border}}">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: {{p.tint}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none">{{p.mark}}</span>
        <span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">{{p.name}}</span><span class="m" style="font-size: 12px; color: #5C6475">{{p.addr}}</span></span>
        <span style="font-size: 12px; color: #5C6475; text-align: right">{{p.note}}</span>
      </li>
    </sc-for>
  </ul>

  <p style="margin: 0 20px; font-size: 12px; line-height: 1.45; color: #5C6475">Names here show up in every transaction Clef explains, so you can spot a familiar recipient at a glance.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  var rows = [
    ['A', 'Alice', '9vRt…k2Lm', 'sent 3×', '#DFF3EE', '#0F7A62'],
    ['B', 'Bob', 'Bb5w…Ue4J', 'Treasury signer', '#E5EDFC', '#2752B8'],
    ['P', 'Payroll', 'Pr7y…Kd2W', 'sent 1×', '#FDF4E3', '#A86400'],
    ['E', 'Exchange deposit', 'Ex8h…Mm3T', 'needs memo', '#ECE7FB', '#5B3FC4']
  ];
  return { people: rows.map(function (r, i) { return { mark: r[0], name: r[1], addr: r[2], note: r[3], tint: r[4], ink: r[5], border: i ? '1px solid #E6E8EE' : '0' }; }) };
}
}
</script>
</body>
</html>
