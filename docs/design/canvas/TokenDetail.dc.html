<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2752B8}a:hover{color:#1A3A86}
button{font:inherit;cursor:pointer}
.m{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #E6E8EE">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </button>
    <span style="width: 28px; height: 28px; border-radius: 50%; background: #E5EDFC; color: #2752B8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">U</span>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">USD Coin</h1>
    <span style="margin-left: auto; padding: 2px 8px; border-radius: 999px; background: #EEF5DD; color: #4A6B12; font-size: 12px; font-weight: 600">Verified mint</span>
  </header>

  <section style="padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">312.40 <span style="font-size: 18px; color: #5C6475; font-weight: 500">USDC</span></div>
    <span style="font-size: 12px; color: #5C6475; font-variant-numeric: tabular-nums">≈ $312.40 · price $1.0000</span>
  </section>

  <nav aria-label="Token actions" style="padding: 0 16px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 44px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600">Send</button>
    <button type="button" style="height: 44px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 14px">Receive</button>
    <button type="button" style="height: 44px; background: #FFFFFF; color: #14171F; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 14px">Swap</button>
  </nav>

  <h2 style="margin: 8px 20px 8px; font-size: 12px; font-weight: 600; color: #5C6475; text-transform: uppercase; letter-spacing: 0.06em">About this token</h2>
  <dl style="margin: 0 12px; padding: 4px 12px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; display: grid; grid-template-columns: 120px minmax(0, 1fr); font-size: 12px">
    <dt style="padding: 7px 0; color: #5C6475">Mint</dt><dd class="m" style="margin: 0; padding: 7px 0; text-align: right">EPjF…Dt1v</dd>
    <dt style="padding: 7px 0; color: #5C6475; border-top: 1px solid #E6E8EE">Program</dt><dd style="margin: 0; padding: 7px 0; text-align: right; border-top: 1px solid #E6E8EE">Token · 6 decimals</dd>
    <dt style="padding: 7px 0; color: #5C6475; border-top: 1px solid #E6E8EE">Your account</dt><dd class="m" style="margin: 0; padding: 7px 0; text-align: right; border-top: 1px solid #E6E8EE">BtLe…9mHv <span style="color: #0F7A62; font-family: 'IBM Plex Sans', sans-serif">✓ ATA</span></dd>
    <dt style="padding: 7px 0; color: #5C6475; border-top: 1px solid #E6E8EE">Freeze authority</dt><dd style="margin: 0; padding: 7px 0; text-align: right; border-top: 1px solid #E6E8EE; color: #A86400">Set · issuer can freeze</dd>
    <dt style="padding: 7px 0; color: #5C6475; border-top: 1px solid #E6E8EE">Delegate</dt><dd style="margin: 0; padding: 7px 0; text-align: right; border-top: 1px solid #E6E8EE; color: #0F7A62">None</dd>
  </dl>

  <h2 style="margin: 24px 20px 8px; font-size: 12px; font-weight: 600; color: #5C6475; text-transform: uppercase; letter-spacing: 0.06em">Recent</h2>
  <ul style="list-style: none; margin: 0 12px; padding: 0 12px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 12px; font-size: 14px">
    <li style="height: 44px; display: flex; align-items: center; gap: 8px"><span style="flex: 1">Swap from SOL</span><span style="font-size: 12px; color: #5C6475">Today</span><span style="color: #0F7A62; font-variant-numeric: tabular-nums">+211.80</span></li>
    <li style="height: 44px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #E6E8EE"><span style="flex: 1">From 9vRt…k2Lm</span><span style="font-size: 12px; color: #5C6475">Yesterday</span><span style="color: #0F7A62; font-variant-numeric: tabular-nums">+25.00</span></li>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
