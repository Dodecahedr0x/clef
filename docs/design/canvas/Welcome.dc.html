<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 0 20px 20px; background: #F5F6F8; color: #14171F; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div aria-hidden="true" style="height: 190px; margin: 0 -20px; position: relative; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; left: 0; right: 0; top: 64px; display: flex; flex-direction: column; gap: 14px">

  <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">Know what<br>you sign.</h1>
  <p style="margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #5C6475">Clef reads every transaction and tells you, in plain words, what it will do.</p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 48px; background: #4A6B12; color: #FFFFFF; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600">Create a new wallet</button>

    <div style="display: flex; justify-content: center; gap: 16px; font-size: 12px; padding-top: 4px">
      <a href="#">Connect Ledger or Keystone</a><a href="#">Watch an address</a>
    </div>
  </div>
</div>
